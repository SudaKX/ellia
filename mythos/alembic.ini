[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# migrations/env.py replaces this fallback with the PROJECT_ROOT-based Settings URL.
sqlalchemy.url = sqlite+aiosqlite:///./data/mythos.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
